<script>
// ================================================================
// MICROCORE WALLET — Fully functional JavaScript for UI.html
// ================================================================

// ─── Dependencies ──────────────────────────────────────────────
const EC = elliptic.ec;
const secp256k1 = new EC('secp256k1');

// ─── Config ────────────────────────────────────────────────────
const REGISTRY_URL = "https://register12345.animax-plorer22.workers.dev";
const SUBS = 1_000_000;

// ─── State ─────────────────────────────────────────────────────
let wallet = null;          // { address, privateKey, mnemonic? }
let ws = null;
let currentNodeUrl = '';
let isLoggedIn = false;

// ─── DOM refs ──────────────────────────────────────────────────
const loginScreen = document.getElementById('loginScreen');
const mainApp = document.getElementById('mainApp');
const loginOptions = document.getElementById('loginOptions');
const loginForm = document.getElementById('loginForm');
const loginFormContent = document.getElementById('loginFormContent');
const loginSubmitBtn = document.getElementById('loginSubmitBtn');
const loginBackBtn = document.getElementById('loginBackBtn');
const toastEl = document.getElementById('toast');
const balanceEl = document.getElementById('homeBalance');
const addressEl = document.getElementById('walletAddress');
const nodeUrlEl = document.getElementById('nodeUrl');
const usernameDisplay = document.getElementById('usernameDisplay');
const walletBalanceEl = document.getElementById('walletBalance');

// ─── Toast helper ──────────────────────────────────────────────
function showToast(msg, duration = 3000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

// ─── Wallet generation ─────────────────────────────────────────
function generateWalletFromMnemonic(mnemonic) {
  const entropy = bip39.mnemonicToEntropy(mnemonic);
  const privateKey = entropy; // hex
  return { privateKey, mnemonic };
}

async function computeAddress(privateKey) {
  const key = secp256k1.keyFromPrivate(privateKey);
  const pub = key.getPublic(true, 'hex');
  const msgBuffer = new TextEncoder().encode(pub);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
  return 'MCR_' + hashHex.slice(0,32).toUpperCase();
}

async function createNewWallet() {
  const mnemonic = bip39.generateMnemonic();
  const { privateKey } = generateWalletFromMnemonic(mnemonic);
  const address = await computeAddress(privateKey);
  return { address, privateKey, mnemonic };
}

async function importFromSeed(seed) {
  const normalized = seed.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!bip39.validateMnemonic(normalized)) {
    throw new Error('Invalid seed phrase');
  }
  const { privateKey } = generateWalletFromMnemonic(normalized);
  const address = await computeAddress(privateKey);
  return { address, privateKey, mnemonic: normalized };
}

async function importFromPrivateKey(privHex) {
  privHex = privHex.trim();
  if (!/^[0-9a-f]{64}$/i.test(privHex)) {
    throw new Error('Invalid private key (must be 64 hex chars)');
  }
  const address = await computeAddress(privHex);
  return { address, privateKey: privHex, mnemonic: null };
}

// ─── Sign message ──────────────────────────────────────────────
function signMessage(privateKey, message) {
  const key = secp256k1.keyFromPrivate(privateKey);
  const sig = key.sign(message);
  const r = sig.r.toString('hex').padStart(64,'0');
  const s = sig.s.toString('hex').padStart(64,'0');
  return r + s;
}

// ─── Storage ──────────────────────────────────────────────────
function loadWalletData() {
  const data = localStorage.getItem('munex_wallet');
  if (data) {
    try { return JSON.parse(data); } catch(_) {}
  }
  return null;
}
function saveWalletData(w) {
  localStorage.setItem('munex_wallet', JSON.stringify(w));
}
function clearWalletData() {
  localStorage.removeItem('munex_wallet');
}

// ─── Connect to node via registry ────────────────────────────
async function discoverNodes() {
  try {
    const resp = await fetch(REGISTRY_URL + '/peers');
    const data = await resp.json();
    const peers = data.peers || [];
    return peers.map(p => p.ws_url).filter(url => url && url.startsWith('ws'));
  } catch (_) {
    return [];
  }
}

function connectToNode(wsUrl) {
  return new Promise((resolve, reject) => {
    const socket = new WebSocket(wsUrl);
    socket.onopen = () => resolve(socket);
    socket.onerror = () => reject(new Error('Connection failed'));
    socket.onclose = () => reject(new Error('Closed'));
    setTimeout(() => {
      if (socket.readyState !== WebSocket.OPEN) {
        socket.close();
        reject(new Error('Timeout'));
      }
    }, 5000);
  });
}

// ─── WebSocket communication ──────────────────────────────────
function sendWsRequest(ws, type, payload) {
  return new Promise((resolve, reject) => {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2,6);
    const msg = JSON.stringify({ type, ...payload, id });
    ws.send(msg);
    const handler = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.id === id) {
          ws.removeEventListener('message', handler);
          resolve(data);
        }
      } catch (_) {}
    };
    ws.addEventListener('message', handler);
    setTimeout(() => {
      ws.removeEventListener('message', handler);
      reject(new Error('Request timeout'));
    }, 10000);
  });
}

// ─── Refresh balance ──────────────────────────────────────────
async function refreshBalance() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    const resp = await sendWsRequest(ws, 'get_balance', { wallet: wallet.address });
    if (resp.success) {
      const bal = resp.balance / SUBS;
      balanceEl.textContent = bal.toFixed(6);
      if (walletBalanceEl) walletBalanceEl.textContent = bal.toFixed(6);
    } else {
      showToast('Balance error: ' + (resp.error || 'unknown'));
    }
  } catch (e) {
    showToast('Failed to get balance: ' + e.message);
  }
}

// ─── Refresh miners ───────────────────────────────────────────
async function refreshMiners() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    const resp = await sendWsRequest(ws, 'get_miners', { wallet: wallet.address });
    if (resp.success) {
      const miners = resp.miners || [];
      const container = document.getElementById('myMinersList');
      if (!container) return;
      if (miners.length === 0) {
        container.innerHTML = '<div class="empty-state">No miners found</div>';
      } else {
        container.innerHTML = miners.map(m => `
          <div class="miner-item">
            <div class="miner-header">
              <span class="miner-name">${m.miner_id}</span>
              <span class="miner-status ${m.active ? 'online' : 'offline'}">${m.active ? 'Active' : 'Inactive'}</span>
            </div>
            <div class="miner-details">
              <span>Blocks: ${m.blocks}</span>
              <span>Rewards: ${m.rewards} MCX</span>
            </div>
          </div>
        `).join('');
      }
    } else {
      showToast('Miners error: ' + (resp.error || 'unknown'));
    }
  } catch (e) {
    showToast('Failed to get miners: ' + e.message);
  }
}

// ─── Send MCX ──────────────────────────────────────────────────
async function sendMCX(to, amount, fee) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const amountSubs = Math.round(amount * SUBS);
  const feeSubs = Math.round(fee * SUBS);
  const timestamp = Math.floor(Date.now() / 1000);
  const nonce = Date.now();
  const msg = `${wallet.address}${to}${amountSubs}${feeSubs}${nonce}${timestamp}`;
  const signature = signMessage(wallet.privateKey, msg);
  const payload = {
    type: 'send',
    wallet: wallet.address,
    to,
    amount: amountSubs,
    fee: feeSubs,
    timestamp,
    nonce,
    signature
  };
  try {
    const resp = await sendWsRequest(ws, 'send', payload);
    if (resp.success) {
      showToast('Transaction sent!');
      refreshBalance();
    } else {
      showToast('Send failed: ' + (resp.error || 'unknown'));
    }
  } catch (e) {
    showToast('Send error: ' + e.message);
  }
}

// ─── Create Token ─────────────────────────────────────────────
async function createToken(name, symbol, supply) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const supplySubs = Math.round(supply * SUBS);
  const timestamp = Math.floor(Date.now() / 1000);
  const nonce = Date.now();
  const msg = `${wallet.address}${name}${symbol}${supplySubs}${nonce}${timestamp}`;
  const signature = signMessage(wallet.privateKey, msg);
  const payload = {
    type: 'create_token',
    wallet: wallet.address,
    name,
    symbol,
    total_supply: supplySubs,
    decimals: 18,
    timestamp,
    nonce,
    signature
  };
  try {
    const resp = await sendWsRequest(ws, 'create_token', payload);
    if (resp.success) {
      showToast('Token created! Address: ' + resp.token_address);
    } else {
      showToast('Token creation failed: ' + (resp.error || 'unknown'));
    }
  } catch (e) {
    showToast('Create token error: ' + e.message);
  }
}

// ─── Connect to registry and login ────────────────────────────
async function connectAndLogin() {
  showToast('Discovering nodes...');
  const urls = await discoverNodes();
  if (urls.length === 0) {
    showToast('No nodes found in registry');
    return false;
  }
  for (const url of urls) {
    try {
      const socket = await connectToNode(url);
      ws = socket;
      currentNodeUrl = url;
      if (nodeUrlEl) nodeUrlEl.textContent = url;
      return true;
    } catch (_) {
      continue;
    }
  }
  showToast('Could not connect to any node');
  return false;
}

// ─── Login flow ────────────────────────────────────────────────
let currentLoginAction = null;

function showLoginForm(action) {
  currentLoginAction = action;
  loginOptions.classList.add('hidden');
  loginForm.classList.remove('hidden');
  let html = '';
  if (action === 'create') {
    html = `<p>Generate a new wallet with a 12‑word seed phrase.</p>
            <button class="btn" id="generateBtn">Generate Wallet</button>
            <div id="newSeedDisplay" class="seed-box" style="margin-top:12px;"></div>
            <p style="font-size:12px; color:var(--text-muted);">Write down your seed phrase and keep it safe.</p>`;
    loginSubmitBtn.textContent = 'Continue to Wallet';
    loginSubmitBtn.disabled = true;
  } else if (action === 'seed') {
    html = `<label>Enter your 12‑word seed phrase</label>
            <textarea id="seedInput" rows="2" placeholder="word1 word2 ... word12"></textarea>`;
    loginSubmitBtn.textContent = 'Recover Wallet';
    loginSubmitBtn.disabled = false;
  } else if (action === 'privkey') {
    html = `<label>Enter your private key (hex, 64 chars)</label>
            <input type="text" id="privkeyInput" placeholder="0123456789abcdef..."/>`;
    loginSubmitBtn.textContent = 'Import Wallet';
    loginSubmitBtn.disabled = false;
  }
  loginFormContent.innerHTML = html;
  if (action === 'create') {
    document.getElementById('generateBtn').addEventListener('click', async function() {
      const newWallet = await createNewWallet();
      window._tempWallet = newWallet;
      document.getElementById('newSeedDisplay').textContent = newWallet.mnemonic;
      loginSubmitBtn.disabled = false;
      showToast('Wallet generated! Click Continue.');
    });
  }
}

loginSubmitBtn.addEventListener('click', async function() {
  if (currentLoginAction === 'create') {
    if (!window._tempWallet) {
      showToast('Generate a wallet first.');
      return;
    }
    wallet = window._tempWallet;
    saveWalletData({ address: wallet.address, privateKey: wallet.privateKey, mnemonic: wallet.mnemonic });
    proceedToDashboard();
  } else if (currentLoginAction === 'seed') {
    const seed = document.getElementById('seedInput').value;
    try {
      const w = await importFromSeed(seed);
      wallet = w;
      saveWalletData({ address: w.address, privateKey: w.privateKey, mnemonic: w.mnemonic });
      proceedToDashboard();
    } catch (e) {
      showToast(e.message);
    }
  } else if (currentLoginAction === 'privkey') {
    const priv = document.getElementById('privkeyInput').value;
    try {
      const w = await importFromPrivateKey(priv);
      wallet = w;
      saveWalletData({ address: w.address, privateKey: w.privateKey, mnemonic: null });
      proceedToDashboard();
    } catch (e) {
      showToast(e.message);
    }
  }
});

loginBackBtn.addEventListener('click', function() {
  loginForm.classList.add('hidden');
  loginOptions.classList.remove('hidden');
});

document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('click', function() {
    showLoginForm(this.dataset.action);
  });
});

async function proceedToDashboard() {
  const connected = await connectAndLogin();
  if (!connected) {
    showToast('Could not connect to any node. Check your network.');
    return;
  }
  loginScreen.classList.add('hidden');
  mainApp.classList.remove('hidden');
  isLoggedIn = true;
  if (usernameDisplay) usernameDisplay.textContent = wallet.address.slice(0,12)+'...';
  if (addressEl) addressEl.textContent = wallet.address;
  // Set settings modal
  const displayAddr = document.getElementById('displayAddress');
  const displaySeed = document.getElementById('displaySeed');
  const displayPriv = document.getElementById('displayPrivateKey');
  if (displayAddr) displayAddr.textContent = wallet.address;
  if (displaySeed) displaySeed.textContent = wallet.mnemonic || '(imported from private key)';
  if (displayPriv) displayPriv.textContent = wallet.privateKey;
  await refreshBalance();
  await refreshMiners();
}

// ─── Dashboard event listeners ────────────────────────────────

// Logout
document.getElementById('logoutBtn')?.addEventListener('click', function() {
  clearWalletData();
  if (ws) ws.close();
  wallet = null;
  isLoggedIn = false;
  mainApp.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  loginOptions.classList.remove('hidden');
  loginForm.classList.add('hidden');
  showToast('Logged out');
});

// Theme toggle
document.getElementById('themeToggle')?.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
});
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
}

// Settings modal
document.getElementById('settingsBtn')?.addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('show');
});
document.getElementById('closeSettings')?.addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('show');
});

// Send button
document.getElementById('sendBtn')?.addEventListener('click', async () => {
  const to = document.getElementById('sendTo').value.trim();
  const amount = parseFloat(document.getElementById('sendAmount').value);
  const fee = parseFloat(document.getElementById('sendFee').value) || 0.001;
  if (!to || isNaN(amount) || amount <= 0) {
    showToast('Invalid recipient or amount');
    return;
  }
  await sendMCX(to, amount, fee);
});

// Create token button
document.getElementById('createTokenBtn')?.addEventListener('click', async () => {
  const name = document.getElementById('tokenName').value.trim();
  const symbol = document.getElementById('tokenSymbol').value.trim();
  const supply = parseFloat(document.getElementById('tokenSupply').value);
  if (!name || !symbol || isNaN(supply) || supply <= 0) {
    showToast('Invalid token details');
    return;
  }
  await createToken(name, symbol, supply);
});

// Refresh miners
document.getElementById('refreshMinersBtn')?.addEventListener('click', refreshMiners);

// ─── Auto-login on page load ──────────────────────────────────
(async function init() {
  const stored = loadWalletData();
  if (stored) {
    wallet = stored;
    const connected = await connectAndLogin();
    if (connected) {
      loginScreen.classList.add('hidden');
      mainApp.classList.remove('hidden');
      isLoggedIn = true;
      if (usernameDisplay) usernameDisplay.textContent = wallet.address.slice(0,12)+'...';
      if (addressEl) addressEl.textContent = wallet.address;
      const displayAddr = document.getElementById('displayAddress');
      const displaySeed = document.getElementById('displaySeed');
      const displayPriv = document.getElementById('displayPrivateKey');
      if (displayAddr) displayAddr.textContent = wallet.address;
      if (displaySeed) displaySeed.textContent = wallet.mnemonic || '(imported from private key)';
      if (displayPriv) displayPriv.textContent = wallet.privateKey;
      await refreshBalance();
      await refreshMiners();
      return;
    }
  }
  loginScreen.classList.remove('hidden');
  mainApp.classList.add('hidden');
})();

</script>
