<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munex Wallet</title>
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bip39@3.1.0/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/elliptic@6.5.4/dist/elliptic.min.js"></script>
  <style>
    /* ── Reset & base ── */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #f2f2f5;
      --card: rgba(255,255,255,0.6);
      --border: rgba(28,28,30,0.08);
      --text: #1c1c1e;
      --text-muted: rgba(28,28,30,0.4);
      --accent: #ff7a45;
      --success: #34c759;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
      --radius: 20px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0b0b0d;
      --card: rgba(44,44,48,0.6);
      --border: rgba(255,255,255,0.08);
      --text: #f2f2f7;
      --text-muted: rgba(255,255,255,0.4);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
      transition: background .3s, color .3s;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand { font-size: 22px; font-weight: 800; }
    .brand em { color: var(--accent); font-style: normal; }
    .header-actions { display: flex; gap: 12px; }
    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: var(--text);
      transition: transform 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .balance {
      font-size: 32px;
      font-weight: 700;
      margin: 8px 0 4px;
    }
    .address {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-muted);
      word-break: break-all;
    }
    .label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 10px;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .miner-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .miner-item:last-child { border-bottom: none; }
    .mono { font-family: monospace; font-size: 13px; }
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .active { background: rgba(52,199,89,0.15); color: #34c759; }
    .inactive { background: rgba(255,59,48,0.12); color: #ff3b30; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 28px 24px;
      max-width: 400px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .modal h3 { margin-bottom: 16px; }
    .modal .seed-box {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      border: 1px solid var(--border);
      margin: 8px 0 12px;
    }
    .close-modal {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
    .login-option {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-option:hover { background: var(--border); }
    .hidden { display: none; }
    .spacer { height: 8px; }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- ─── LOGIN SCREEN ─── -->
  <div id="loginScreen">
    <div class="card" style="text-align:center;">
      <div class="brand">Munex <em>Wallet</em></div>
      <p style="margin:12px 0 20px; color:var(--text-muted);">Connect to the MicroCore network</p>
      <div id="loginOptions">
        <button class="login-option" data-action="create">✨ Create New Wallet</button>
        <button class="login-option" data-action="seed">🔑 Import Seed Phrase</button>
        <button class="login-option" data-action="privkey">🔐 Import Private Key</button>
      </div>
      <div id="loginForm" class="hidden">
        <div id="loginFormContent"></div>
        <button class="btn" id="loginSubmitBtn">Proceed</button>
        <button class="btn btn-secondary" id="loginBackBtn" style="margin-top:8px;">Back</button>
      </div>
    </div>
  </div>

  <!-- ─── MAIN DASHBOARD ─── -->
  <div id="mainScreen" class="hidden">
    <div class="card header">
      <div class="brand">Munex <em>Wallet</em></div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">🌓</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
        <button class="icon-btn" id="logoutBtn" title="Logout">🚪</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Balance</div>
      <div class="balance" id="balanceDisplay">0.000000</div>
      <div class="address" id="walletAddress">MCR_...</div>
      <div style="margin-top:8px; font-size:12px; color:var(--text-muted);">
        Connected to: <span id="nodeUrl">—</span>
      </div>
    </div>

    <!-- Send MCX -->
    <div class="card">
      <div class="label">Send MCX</div>
      <input type="text" id="sendTo" placeholder="Recipient address (MCR_...)" />
      <input type="number" id="sendAmount" placeholder="Amount (MCX)" step="0.000001" />
      <input type="number" id="sendFee" placeholder="Fee (MCX, default 0.001)" step="0.000001" value="0.001" />
      <button class="btn" id="sendBtn">Send</button>
    </div>

    <!-- Create Token -->
    <div class="card">
      <div class="label">Create Token</div>
      <input type="text" id="tokenName" placeholder="Token Name" />
      <input type="text" id="tokenSymbol" placeholder="Symbol" />
      <input type="number" id="tokenSupply" placeholder="Total Supply (in units)" step="1" />
      <button class="btn btn-secondary" id="createTokenBtn">Create Token</button>
    </div>

    <!-- Miners -->
    <div class="card">
      <div class="label">Your Miners</div>
      <div id="minerList">
        <div class="miner-item"><span class="mono">No miners found</span></div>
      </div>
      <button class="btn btn-secondary" id="refreshMinersBtn" style="margin-top:12px;">Refresh Miners</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal">
      <h3>⚙️ Wallet Settings</h3>
      <label>Address</label>
      <div class="seed-box" id="displayAddress"></div>
      <label>Seed Phrase (12 words)</label>
      <div class="seed-box" id="displaySeed"></div>
      <label>Private Key (hex)</label>
      <div class="seed-box" id="displayPrivateKey" style="font-size:12px;"></div>
      <div class="close-modal" id="closeSettings">Close</div>
    </div>
  </div>

  <script>
    // ─── Dependencies ──────────────────────────────────────────────
    const EC = elliptic.ec;
    const secp256k1 = new EC('secp256k1');

    // ─── State ──────────────────────────────────────────────────────
    let wallet = null;          // { address, privateKey, mnemonic? }
    let ws = null;
    let currentNodeUrl = '';
    let isLoggedIn = false;

    // ─── DOM refs ──────────────────────────────────────────────────
    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const loginOptions = document.getElementById('loginOptions');
    const loginForm = document.getElementById('loginForm');
    const loginFormContent = document.getElementById('loginFormContent');
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');
    const loginBackBtn = document.getElementById('loginBackBtn');
    const toastEl = document.getElementById('toast');
    const balanceEl = document.getElementById('balanceDisplay');
    const addressEl = document.getElementById('walletAddress');
    const nodeUrlEl = document.getElementById('nodeUrl');

    // ─── Toast helper ──────────────────────────────────────────────
    function showToast(msg, duration = 3000) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    // ─── Wallet generation ─────────────────────────────────────────
    function generateWalletFromMnemonic(mnemonic) {
      const entropy = bip39.mnemonicToEntropy(mnemonic);
      const privateKey = entropy; // hex
      const key = secp256k1.keyFromPrivate(privateKey);
      const pub = key.getPublic(true, 'hex');
      // Compute address: MCR_ + SHA256(pub) first 32 hex uppercase
      // We need a synchronous SHA256 – use a simple digest via crypto.subtle but we'll do async
      // We'll compute it asynchronously, but we can also use a simple hash: use a library? 
      // For simplicity, we'll use a synchronous hash using a custom function (since we can't use crypto.subtle sync)
      // We'll implement a simple SHA256 using the built-in crypto.subtle but we need to await.
      // We'll do the address computation asynchronously in the init function.
      // Return a promise.
      return { privateKey, mnemonic };
    }

    async function computeAddress(privateKey) {
      const key = secp256k1.keyFromPrivate(privateKey);
      const pub = key.getPublic(true, 'hex');
      const msgBuffer = new TextEncoder().encode(pub);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
      return 'MCR_' + hashHex.slice(0,32).toUpperCase();
    }

    async function createNewWallet() {
      const mnemonic = bip39.generateMnemonic();
      const { privateKey } = generateWalletFromMnemonic(mnemonic);
      const address = await computeAddress(privateKey);
      return { address, privateKey, mnemonic };
    }

    async function importFromSeed(seed) {
      const normalized = seed.trim().toLowerCase().replace(/\s+/g, ' ');
      if (!bip39.validateMnemonic(normalized)) {
        throw new Error('Invalid seed phrase');
      }
      const { privateKey } = generateWalletFromMnemonic(normalized);
      const address = await computeAddress(privateKey);
      return { address, privateKey, mnemonic: normalized };
    }

    async function importFromPrivateKey(privHex) {
      privHex = privHex.trim();
      if (!/^[0-9a-f]{64}$/i.test(privHex)) {
        throw new Error('Invalid private key (must be 64 hex chars)');
      }
      const key = secp256k1.keyFromPrivate(privHex);
      const address = await computeAddress(privHex);
      return { address, privateKey: privHex, mnemonic: null };
    }

    // ─── Sign message ──────────────────────────────────────────────
    function signMessage(privateKey, message) {
      const key = secp256k1.keyFromPrivate(privateKey);
      const sig = key.sign(message);
      const r = sig.r.toString('hex').padStart(64,'0');
      const s = sig.s.toString('hex').padStart(64,'0');
      return r + s;
    }

    // ─── Storage ──────────────────────────────────────────────────
    function loadWalletData() {
      const data = localStorage.getItem('munex_wallet');
      if (data) {
        try { return JSON.parse(data); } catch(_) {}
      }
      return null;
    }
    function saveWalletData(w) {
      localStorage.setItem('munex_wallet', JSON.stringify(w));
    }
    function clearWalletData() {
      localStorage.removeItem('munex_wallet');
    }

    // ─── Connect to node via registry ────────────────────────────
    async function discoverNodes() {
      try {
        const resp = await fetch('https://register12345.animax-plorer22.workers.dev/peers');
        const data = await resp.json();
        const peers = data.peers || [];
        return peers.map(p => p.ws_url).filter(url => url && url.startsWith('ws'));
      } catch (_) {
        return [];
      }
    }

    function connectToNode(wsUrl) {
      return new Promise((resolve, reject) => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => resolve(socket);
        socket.onerror = () => reject(new Error('Connection failed'));
        socket.onclose = () => reject(new Error('Closed'));
        setTimeout(() => {
          if (socket.readyState !== WebSocket.OPEN) {
            socket.close();
            reject(new Error('Timeout'));
          }
        }, 5000);
      });
    }

    // ─── WebSocket communication ──────────────────────────────────
    function sendWsRequest(ws, type, payload) {
      return new Promise((resolve, reject) => {
        const id = Date.now() + '_' + Math.random().toString(36).slice(2,6);
        const msg = JSON.stringify({ type, ...payload, id });
        ws.send(msg);
        const handler = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.id === id) {
              ws.removeEventListener('message', handler);
              resolve(data);
            }
          } catch (_) {}
        };
        ws.addEventListener('message', handler);
        setTimeout(() => {
          ws.removeEventListener('message', handler);
          reject(new Error('Request timeout'));
        }, 10000);
      });
    }

    // ─── Refresh balance ──────────────────────────────────────────
    async function refreshBalance() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        const resp = await sendWsRequest(ws, 'get_balance', { wallet: wallet.address });
        if (resp.success) {
          const bal = resp.balance / 1e6;
          balanceEl.textContent = bal.toFixed(6);
        } else {
          showToast('Balance error: ' + (resp.error || 'unknown'));
        }
      } catch (e) {
        showToast('Failed to get balance: ' + e.message);
      }
    }

    // ─── Refresh miners ───────────────────────────────────────────
    async function refreshMiners() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        const resp = await sendWsRequest(ws, 'get_miners', { wallet: wallet.address });
        if (resp.success) {
          const miners = resp.miners || [];
          const container = document.getElementById('minerList');
          if (miners.length === 0) {
            container.innerHTML = '<div class="miner-item"><span class="mono">No miners found</span></div>';
          } else {
            container.innerHTML = miners.map(m => `
              <div class="miner-item">
                <span class="mono">${m.miner_id}</span>
                <span class="status-badge ${m.active ? 'active' : 'inactive'}">${m.active ? 'Active' : 'Inactive'}</span>
              </div>
            `).join('');
          }
        } else {
          showToast('Miners error: ' + (resp.error || 'unknown'));
        }
      } catch (e) {
        showToast('Failed to get miners: ' + e.message);
      }
    }

    // ─── Send MCX ──────────────────────────────────────────────────
    async function sendMCX(to, amount, fee) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const amountSubs = Math.round(amount * 1e6);
      const feeSubs = Math.round(fee * 1e6);
      const timestamp = Math.floor(Date.now() / 1000);
      const nonce = Date.now();
      const msg = `${wallet.address}${to}${amountSubs}${feeSubs}${nonce}${timestamp}`;
      const signature = signMessage(wallet.privateKey, msg);
      const payload = {
        type: 'send',
        wallet: wallet.address,
        to,
        amount: amountSubs,
        fee: feeSubs,
        timestamp,
        nonce,
        signature
      };
      try {
        const resp = await sendWsRequest(ws, 'send', payload);
        if (resp.success) {
          showToast('Transaction sent!');
          refreshBalance();
        } else {
          showToast('Send failed: ' + (resp.error || 'unknown'));
        }
      } catch (e) {
        showToast('Send error: ' + e.message);
      }
    }

    // ─── Create Token ─────────────────────────────────────────────
    async function createToken(name, symbol, supply) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const supplySubs = Math.round(supply * 1e6);
      const timestamp = Math.floor(Date.now() / 1000);
      const nonce = Date.now();
      const msg = `${wallet.address}${name}${symbol}${supplySubs}${nonce}${timestamp}`;
      const signature = signMessage(wallet.privateKey, msg);
      const payload = {
        type: 'create_token',
        wallet: wallet.address,
        name,
        symbol,
        total_supply: supplySubs,
        decimals: 18,
        timestamp,
        nonce,
        signature
      };
      try {
        const resp = await sendWsRequest(ws, 'create_token', payload);
        if (resp.success) {
          showToast('Token created! Address: ' + resp.token_address);
        } else {
          showToast('Token creation failed: ' + (resp.error || 'unknown'));
        }
      } catch (e) {
        showToast('Create token error: ' + e.message);
      }
    }

    // ─── Connect to registry and login ────────────────────────────
    async function connectAndLogin() {
      showToast('Discovering nodes...');
      const urls = await discoverNodes();
      if (urls.length === 0) {
        showToast('No nodes found in registry');
        return false;
      }
      for (const url of urls) {
        try {
          const socket = await connectToNode(url);
          ws = socket;
          currentNodeUrl = url;
          nodeUrlEl.textContent = url;
          // No need to handle messages; we use request/response.
          return true;
        } catch (_) {
          continue;
        }
      }
      showToast('Could not connect to any node');
      return false;
    }

    // ─── Login flow ────────────────────────────────────────────────
    let currentLoginAction = null;

    function showLoginForm(action) {
      currentLoginAction = action;
      loginOptions.classList.add('hidden');
      loginForm.classList.remove('hidden');
      let html = '';
      if (action === 'create') {
        html = `<p>Generate a new wallet with a 12‑word seed phrase.</p>
                <button class="btn" id="generateBtn">Generate Wallet</button>
                <div id="newSeedDisplay" class="seed-box" style="margin-top:12px;"></div>
                <p style="font-size:12px; color:var(--text-muted);">Write down your seed phrase and keep it safe.</p>`;
        loginSubmitBtn.textContent = 'Continue to Wallet';
        loginSubmitBtn.disabled = true;
      } else if (action === 'seed') {
        html = `<label>Enter your 12‑word seed phrase</label>
                <textarea id="seedInput" rows="2" placeholder="word1 word2 ... word12"></textarea>`;
        loginSubmitBtn.textContent = 'Recover Wallet';
        loginSubmitBtn.disabled = false;
      } else if (action === 'privkey') {
        html = `<label>Enter your private key (hex, 64 chars)</label>
                <input type="text" id="privkeyInput" placeholder="0123456789abcdef..."/>`;
        loginSubmitBtn.textContent = 'Import Wallet';
        loginSubmitBtn.disabled = false;
      }
      loginFormContent.innerHTML = html;
      // If create, handle generate button
      if (action === 'create') {
        document.getElementById('generateBtn').addEventListener('click', async function() {
          const newWallet = await createNewWallet();
          // Store wallet temporarily
          window._tempWallet = newWallet;
          document.getElementById('newSeedDisplay').textContent = newWallet.mnemonic;
          loginSubmitBtn.disabled = false;
          showToast('Wallet generated! Click Continue.');
        });
      }
    }

    loginSubmitBtn.addEventListener('click', async function() {
      if (currentLoginAction === 'create') {
        if (!window._tempWallet) {
          showToast('Generate a wallet first.');
          return;
        }
        wallet = window._tempWallet;
        saveWalletData({ address: wallet.address, privateKey: wallet.privateKey, mnemonic: wallet.mnemonic });
        proceedToDashboard();
      } else if (currentLoginAction === 'seed') {
        const seed = document.getElementById('seedInput').value;
        try {
          const w = await importFromSeed(seed);
          wallet = w;
          saveWalletData({ address: w.address, privateKey: w.privateKey, mnemonic: w.mnemonic });
          proceedToDashboard();
        } catch (e) {
          showToast(e.message);
        }
      } else if (currentLoginAction === 'privkey') {
        const priv = document.getElementById('privkeyInput').value;
        try {
          const w = await importFromPrivateKey(priv);
          wallet = w;
          saveWalletData({ address: w.address, privateKey: w.privateKey, mnemonic: null });
          proceedToDashboard();
        } catch (e) {
          showToast(e.message);
        }
      }
    });

    loginBackBtn.addEventListener('click', function() {
      loginForm.classList.add('hidden');
      loginOptions.classList.remove('hidden');
    });

    // Login option buttons
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', function() {
        showLoginForm(this.dataset.action);
      });
    });

    async function proceedToDashboard() {
      // Try to connect to a node
      const connected = await connectAndLogin();
      if (!connected) {
        showToast('Could not connect to any node. Check your network.');
        return;
      }
      // Show main UI
      loginScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      isLoggedIn = true;
      // Update address
      addressEl.textContent = wallet.address;
      // Set settings modal
      document.getElementById('displayAddress').textContent = wallet.address;
      document.getElementById('displaySeed').textContent = wallet.mnemonic || '(imported from private key)';
      document.getElementById('displayPrivateKey').textContent = wallet.privateKey;
      // Refresh data
      await refreshBalance();
      await refreshMiners();
    }

    // ─── Dashboard event listeners ────────────────────────────────

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', function() {
      clearWalletData();
      if (ws) { ws.close(); }
      wallet = null;
      isLoggedIn = false;
      mainScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      loginOptions.classList.remove('hidden');
      loginForm.classList.add('hidden');
      showToast('Logged out');
    });

    // Theme toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });
    // Load theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    // Settings modal
    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.add('show');
    });
    document.getElementById('closeSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('show');
    });

    // Send button
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const to = document.getElementById('sendTo').value.trim();
      const amount = parseFloat(document.getElementById('sendAmount').value);
      const fee = parseFloat(document.getElementById('sendFee').value) || 0.001;
      if (!to || isNaN(amount) || amount <= 0) {
        showToast('Invalid recipient or amount');
        return;
      }
      await sendMCX(to, amount, fee);
    });

    // Create token button
    document.getElementById('createTokenBtn').addEventListener('click', async () => {
      const name = document.getElementById('tokenName').value.trim();
      const symbol = document.getElementById('tokenSymbol').value.trim();
      const supply = parseFloat(document.getElementById('tokenSupply').value);
      if (!name || !symbol || isNaN(supply) || supply <= 0) {
        showToast('Invalid token details');
        return;
      }
      await createToken(name, symbol, supply);
    });

    // Refresh miners
    document.getElementById('refreshMinersBtn').addEventListener('click', refreshMiners);

    // ─── Auto-login on page load ──────────────────────────────────
    (async function init() {
      const stored = loadWalletData();
      if (stored) {
        wallet = stored;
        // Try to connect and login automatically
        const connected = await connectAndLogin();
        if (connected) {
          loginScreen.classList.add('hidden');
          mainScreen.classList.remove('hidden');
          isLoggedIn = true;
          addressEl.textContent = wallet.address;
          document.getElementById('displayAddress').textContent = wallet.address;
          document.getElementById('displaySeed').textContent = wallet.mnemonic || '(imported from private key)';
          document.getElementById('displayPrivateKey').textContent = wallet.privateKey;
          await refreshBalance();
          await refreshMiners();
          return;
        }
      }
      // Otherwise show login screen
      loginScreen.classList.remove('hidden');
      mainScreen.classList.add('hidden');
    })();
  </script>
</body>
</html>
